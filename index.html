<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sipariş Takip</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:#172033;background:#f3f5f8}
*{box-sizing:border-box}body{margin:0;padding:14px;max-width:760px;margin:auto}
header{padding:14px 4px 8px}h1{font-size:26px;margin:0 0 4px}p{margin:0;color:#647084;font-size:14px}
.panel{background:#fff;border:1px solid #e1e6ee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #1720330a}
h2{font-size:18px;margin:0 0 12px}.field{margin:12px 0}label{display:block;font-size:13px;font-weight:650;margin-bottom:6px}
input,select,button{font:inherit}input[type=text],input[type=search],input[type=date],select{width:100%;padding:13px;border:1px solid #ccd4df;border-radius:10px;background:#fff}
button{border:0;border-radius:12px;padding:13px 15px;font-weight:700;cursor:pointer;min-height:48px}
.primary{background:#172033;color:#fff;width:100%}.secondary{background:#e9edf3;color:#172033}.danger{background:#fff0f0;color:#a12626}
.sm{min-height:38px;padding:8px 12px;font-size:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{border:2px solid #dfe5ee;border-radius:14px;padding:12px;margin:12px 0;background:#fafbfd}
.ihead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.qty{display:flex;align-items:center;gap:12px;margin:12px 0}.qty button{width:58px;height:58px;font-size:30px;line-height:1;padding:0;background:#172033;color:#fff}
.qty button[data-a=dec]{background:#e9edf3;color:#172033}.qty span{min-width:44px;text-align:center;font-size:28px;font-weight:800}.qty small{color:#687487}
.photo{display:block;text-align:center;border:2px dashed #b9c3d2;border-radius:12px;padding:13px;margin:0 0 8px;cursor:pointer;color:#172033}
.preview{width:100%;max-height:220px;object-fit:contain;border-radius:8px;background:#f1f3f6;margin-bottom:8px}
.iname{margin-top:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.chip{background:#e9edf3;border-radius:20px;padding:10px 15px;font-size:14px;font-weight:650;cursor:pointer}
.add{width:100%;background:#1f7a46;color:#fff;font-size:17px;min-height:56px;margin:4px 0 14px}
.orderhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.order{border:1px solid #e1e6ee;border-radius:14px;padding:14px;margin:10px 0;cursor:pointer;background:#fff}
.order h3{margin:0 0 3px;font-size:17px}.muted{color:#687487;font-size:13px}
.status{font-size:12px;padding:5px 9px;border-radius:20px;background:#fff3d8;color:#805500;white-space:nowrap}.status.done{background:#e4f6eb;color:#17653a}.status.ret{background:#fdeaea;color:#a12626}
.itemline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid #edf0f4;font-size:15px}
.dphoto{width:110px;height:110px;object-fit:cover;border-radius:10px;background:#f1f3f6}
.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar button{flex:1}
.empty{text-align:center;padding:22px;color:#687487}.note{font-size:12px;color:#687487;line-height:1.5;margin:10px 2px}
#banner{background:#e4f6eb;color:#17653a;border-radius:12px;padding:12px;font-size:13px;margin:8px 0}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:9}
:root{background:linear-gradient(160deg,#f4f4f5,#e4e4e7) fixed;min-height:100%}
header{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#000,#27272a);border-radius:20px;padding:16px 18px;margin-bottom:8px;box-shadow:0 6px 18px #00000033}
header h1{color:#fff;margin:0 0 3px}header p{color:#d4d4d8}header svg{width:56px;height:56px;border-radius:14px;flex:none}
.muted,.note{color:#71717a}.secondary{background:#e4e4e7;color:#111}
.primary{background:linear-gradient(135deg,#000,#3f3f46)}
#custBtn{background:#fff;color:#111;border:2px solid #111}
.add{background:#fff;color:#111;border:2px dashed #111}
h2{color:#111}.panel{border-top:4px solid #111}
.order{border-left:6px solid var(--s,#cbd5e1)}
.item{border:2px solid var(--c,#dfe5ee);border-left-width:8px;background:#fff}
.qty button[data-a=inc]{background:#111}
.photo{border-color:#a1a1aa;color:#111}
.tag{display:inline-block;background:var(--c);color:#fff;border-radius:20px;padding:4px 11px;font-size:12px;font-weight:700;margin:6px 6px 0 0}
.catname{color:#111}.chip{background:#f4f4f5;border:1px solid #d4d4d8;color:#111}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.ph{position:relative}.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;background:#f1f3f6;display:block}
.ph button{position:absolute;top:4px;right:4px;min-height:32px;width:32px;padding:0;border-radius:50%;background:#000c;color:#fff;font-size:14px}
.photobtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}.photobtns .photo{margin:0;padding:14px 6px;font-size:14px;font-weight:650}
.itemline{flex-wrap:wrap}.dphotos{display:flex;gap:6px;flex-wrap:wrap;width:100%}.dphoto{width:88px;height:88px;cursor:zoom-in}
#lb{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:20}#lb img{max-width:96%;max-height:92%;border-radius:8px}
:root{background:#f4f4f5}body{padding:12px}
header{background:none;box-shadow:none;padding:6px 2px 10px;margin:0;gap:12px}header h1{color:#111;font-size:22px;margin:0}header svg{width:44px;height:44px;border-radius:12px}
.topbtns{display:grid;grid-template-columns:1.6fr 1fr;gap:8px}.topbtns button{width:100%;margin:0}
#custBtn{border:0;background:#e4e4e7;color:#111}
.panel{border-top:0;box-shadow:none;border:1px solid #e4e4e7}
.sec{font-size:13px;color:#71717a;font-weight:650;letter-spacing:.04em;text-transform:uppercase;margin:18px 2px 8px}
.order{border:1px solid #e4e4e7;border-left:5px solid var(--s,#d4d4d8);box-shadow:none}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.del{min-height:36px;padding:6px 12px;background:#fff0f0;color:#a12626;font-size:13px;flex:none}
#filterBar{display:flex;justify-content:space-between;align-items:center;background:#111;color:#fff;border-radius:12px;padding:8px 8px 8px 14px;margin:10px 0 0;font-size:14px}
#filterBar button{background:#27272a;color:#fff;min-height:36px;padding:6px 12px;font-size:13px}
details.bk{margin-top:24px;background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:12px 14px}details.bk summary{font-weight:650;color:#52525b;cursor:pointer}details.bk .toolbar{margin-top:12px}
#dlg{position:fixed;inset:0;background:#0009;display:flex;align-items:center;justify-content:center;z-index:30;padding:20px}
#dlg .box{background:#fff;border-radius:18px;padding:20px;max-width:360px;width:100%}#dlgMsg{color:#111;font-size:16px;line-height:1.45;white-space:pre-line;margin:0 0 16px}
#dlgBtns{display:flex;gap:10px}#dlgBtns button{flex:1}.danger2{background:#b91c1c;color:#fff}
header img.logo{width:44px;height:44px;border-radius:12px;flex:none;display:block}
#filterBar .fb{display:flex;gap:6px}.fbtn{display:flex;gap:6px;flex:none}.shr{min-height:36px;padding:6px 12px;background:#111;color:#fff;font-size:13px}
[hidden]{display:none!important}
</style>

<script>
const DB_NAME='siparis-takip-db',STORE='orders',BK='backup_v1',CATS=['Far camı','Far kasası','Far','Far beyni'];
const CCOL={'Far camı':'#111111','Far kasası':'#3f3f46','Far':'#52525b','Far beyni':'#71717a'},STCOL={'Hazırlandı':'#f59e0b','Teslim edildi':'#22c55e','İade':'#ef4444'};
let db,items=[],editingId=null;
const $=id=>document.getElementById(id);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function today(){const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function formatDate(v){if(!v)return 'Tarih yok';const [y,m,d]=v.split('-').map(Number);return `${String(d).padStart(2,'0')}.${String(m).padStart(2,'0')}.${y} · ${new Date(y,m-1,d).toLocaleDateString('tr-TR',{weekday:'long'})}`}
function toast(t){const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function dlg(msg,btns){return new Promise(res=>{const d=$('dlg');$('dlgMsg').textContent=msg;const w=$('dlgBtns');w.innerHTML='';btns.forEach(([t,v,c])=>{const b=document.createElement('button');b.type='button';b.textContent=t;b.className=c;b.onclick=()=>{d.hidden=true;res(v)};w.appendChild(b)});d.hidden=false})}
const ask=(m,ok='Tamam',no='İptal')=>dlg(m,[[no,false,'secondary'],[ok,true,/sil|üzerine/i.test(ok)?'danger2':'primary']]);
const say=m=>dlg(m,[['Tamam',true,'primary']]);
function show(v){['vList','vDetail','vForm','vCust'].forEach(x=>$(x).hidden=x!==v);window.scrollTo(0,0)}

/* ---- IndexedDB (aynı veritabanı, sürüm 2) ---- */
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,3);
 r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains(STORE))d.createObjectStore(STORE,{keyPath:'id'});if(!d.objectStoreNames.contains(BK))d.createObjectStore(BK,{keyPath:'id'});if(!d.objectStoreNames.contains('customers'))d.createObjectStore('customers',{keyPath:'id'})};
 r.onsuccess=()=>{db=r.result;res()};r.onerror=()=>rej(r.error)})}
const rq=(s,m,f)=>new Promise((res,rej)=>{const t=db.transaction(s,m);let r;try{r=f(t.objectStore(s))}catch(e){return rej(e)}t.oncomplete=()=>res(r.result);t.onerror=t.onabort=()=>rej(t.error)});
const all=async(s=STORE)=>(await rq(s,'readonly',x=>x.getAll())).sort((a,b)=>(b.created||0)-(a.created||0));
const get=(id,s=STORE)=>rq(s,'readonly',x=>x.get(id));
const put=(o,s=STORE)=>rq(s,'readwrite',x=>x.put(o));
const del=id=>rq(STORE,'readwrite',x=>x.delete(id));

/* ---- Müşteri geçmişi ---- */
const key=s=>String(s||'').trim().toLocaleLowerCase('tr');
let custs=[];
const sortCusts=()=>custs.sort((a,b)=>a.name.localeCompare(b.name,'tr'));
async function loadCusts(){custs=(await all('customers')).filter(c=>c.id!=='__meta__');sortCusts()}
async function ensureCustomer(name){name=(name||'').trim();if(!name||custs.some(c=>key(c.name)===key(name)))return;const c={id:uid(),name,created:Date.now()};await put(c,'customers');custs.push(c);sortCusts()}
async function seedCusts(){if(await get('__meta__','customers'))return;for(const o of await all())await ensureCustomer(o.customer);await put({id:'__meta__',created:0},'customers')}
function renderChips(){
 const v=key($('customer').value),m=custs.filter(c=>key(c.name).includes(v)).slice(0,8),exact=custs.some(c=>key(c.name)===v);
 $('custList').innerHTML=m.map(c=>`<span class="chip" data-n="${esc(c.name)}">${esc(c.name)}</span>`).join('')+(v&&!exact?`<div class="muted" style="width:100%">Yeni müşteri olarak kaydedilecek: <b>${esc($('customer').value.trim())}</b></div>`:'');
}
async function renderCust(){
 const q=key($('custSearch').value),cnt={};(await all()).forEach(o=>{const k=key(o.customer);if(k)cnt[k]=(cnt[k]||0)+1});
 const l=custs.filter(c=>key(c.name).includes(q));
 $('custRows').innerHTML=l.length?l.map(c=>`<div class="order crow" data-id="${esc(c.id)}" style="cursor:default"><h3>${esc(c.name)}</h3><div class="muted">${cnt[key(c.name)]||0} sipariş</div><div class="actions"><button class="secondary sm" data-a="show" type="button">Siparişlerini göster</button><button class="danger sm" data-a="del" type="button">Müşteriyi sil</button></div></div>`).join(''):`<div class="empty">${q?'Müşteri bulunamadı.':'Kayıtlı müşteri yok. Kayıt eklerken yazdığın isimler burada birikir.'}</div>`;
}
async function removeCust(id){
 const c=custs.find(x=>x.id===id);if(!c)return;
 if(!await ask(`"${c.name}" müşteri kaydı silinsin mi?`,'Sil'))return;
 const os=(await all()).filter(o=>key(o.customer)===key(c.name));let n=0;
 if(os.length&&await ask(`Bu müşterinin ${os.length} siparişi var. Siparişleri de silinsin mi?`,'Siparişleri de sil','Siparişler kalsın')){for(const o of os)await del(o.id);n=os.length}
 await rq('customers','readwrite',s=>s.delete(id));await loadCusts();await renderCust();toast(n?`Müşteri ve ${n} sipariş silindi`:'Müşteri silindi');
}
$('customer').oninput=renderChips;
$('custList').onclick=e=>{const c=e.target.closest('.chip');if(c){$('customer').value=c.dataset.n;renderChips()}};
$('custBtn').onclick=async()=>{$('custSearch').value='';await renderCust();show('vCust')};
$('custBack').onclick=()=>goList();
$('custSearch').oninput=renderCust;
$('custRows').onclick=e=>{const b=e.target.closest('button'),r=e.target.closest('.crow');if(!b||!r)return;
 if(b.dataset.a==='del')removeCust(r.dataset.id);
 else{const c=custs.find(x=>x.id===r.dataset.id);if(c){filter=c.name;showAll=true;goList()}}};

/* ---- Eski kayıtları yeni yapıya çevirme (hiçbir alan silinmez) ---- */
const itemPhotos=i=>Array.isArray(i.photos)?i.photos:(i.photo?[i.photo]:[]);
function norm(o){
 if(o.schema===2)return o;
 const items=Array.isArray(o.items)?o.items:(o.parts||[]).filter(p=>(p.qty>0)||p.photo).map(p=>({uid:uid(),category:p.name,name:'',qty:p.qty||0,photos:p.photo?[p.photo]:[]}));
 let b=o.brand,m=o.model;
 if(b===undefined&&m===undefined){const v=(o.vehicle||'').trim(),i=v.indexOf(' ');b=i<0?v:v.slice(0,i);m=i<0?'':v.slice(i+1).trim()}
 return {...o,schema:2,customer:o.customer||'',brand:b||'',model:m||'',items,created:o.created||Date.now()};
}
async function migrate(){
 const old=(await all()).filter(o=>o.schema!==2);if(!old.length)return;
 for(const o of old){if(!(await get(o.id,BK)))await put(o,BK)}   // 1) önce yedek kopyası
 for(const o of old)await put(norm(o));                            // 2) sonra dönüştür
 $('banner').hidden=false;$('banner').textContent=`${old.length} eski kayıt yeni yapıya dönüştürüldü. Eski hâllerinin yedeği cihazda saklandı.`;
}

/* ---- Liste ---- */
const vehicleText=o=>[o.brand,o.model].filter(Boolean).join(' ');
const summary=o=>(o.items||[]).map(i=>`<span class="tag" style="--c:${CCOL[i.category]||'#64748b'}">${i.qty} ${esc(i.category)}${i.name?' · '+esc(i.name):''}</span>`).join('')||'<span class="muted">Ürün yok</span>';
let filter='',showAll=false;
async function render(){
 let list=await all();
 if(filter)list=list.filter(o=>key(o.customer)===key(filter));
 const total=list.length;if(!filter&&!showAll)list=list.slice(0,10);
 $('filterBar').hidden=!filter;$('filterBar').innerHTML=filter?`<span>${esc(filter)} · ${total} sipariş</span><span class="fb"><button type="button" id="shF">Paylaş</button><button type="button" id="clrF">✕ Kaldır</button></span>`:'';
 $('orders').innerHTML=(list.length?list.map(o=>`<article class="order" data-id="${esc(o.id)}" style="--s:${STCOL[o.status]||'#d4d4d8'}"><div class="orderhead"><div><h3>${esc(o.customer||'İsimsiz müşteri')}</h3>${vehicleText(o)?`<div class="muted">${esc(vehicleText(o))}</div>`:''}<div class="muted">${esc(formatDate(o.date))}</div></div><span class="status ${o.status==='Teslim edildi'?'done':o.status==='İade'?'ret':''}">${esc(o.status)}</span></div><div class="foot"><div>${summary(o)}</div><div class="fbtn"><button class="shr" type="button">Paylaş</button><button class="del" type="button" aria-label="Siparişi sil">Sil</button></div></div></article>`).join(''):'<div class="empty">Henüz sipariş yok.</div>')+(!filter&&!showAll&&total>10?`<button class="secondary" id="moreBtn" type="button" style="width:100%">Tümünü göster (${total})</button>`:'');
}
async function goList(){show('vList');await render()}
$('orders').onclick=async e=>{
 if(e.target.closest('#moreBtn')){showAll=true;return render()}
 const a=e.target.closest('.order');if(!a)return;
 if(e.target.closest('.shr')){const o=await get(a.dataset.id);if(o)shareOrders([o],true);return}
 if(e.target.closest('.del')){const o=await get(a.dataset.id);if(o&&await ask(`"${o.customer||'İsimsiz müşteri'}" siparişi silinsin mi?`,'Sil')){await del(a.dataset.id);toast('Sipariş silindi');render()}return}
 openDetail(a.dataset.id)};
$('filterBar').onclick=async e=>{if(e.target.closest('#clrF')){filter='';render()}else if(e.target.closest('#shF'))shareOrders((await all()).filter(o=>key(o.customer)===key(filter)),false)};

/* ---- Detay ---- */
/* ---- Paylaşma ---- */
function orderText(o){
 const L=[`Sipariş: ${o.customer||'İsimsiz müşteri'}`];const v=vehicleText(o);if(v)L.push('Araç: '+v);
 L.push('Tarih: '+formatDate(o.date),'Durum: '+o.status,'Ürünler:');
 (o.items||[]).forEach(i=>L.push(`- ${i.qty} adet ${i.category}${i.name?' ('+i.name+')':''}`));
 if(!(o.items||[]).length)L.push('- (ürün yok)');return L.join('\n');
}
const toFile=(u,n)=>{const [h,d]=u.split(','),m=/:(.*?);/.exec(h)[1],bin=atob(d),a=new Uint8Array(bin.length);for(let k=0;k<bin.length;k++)a[k]=bin.charCodeAt(k);return new File([a],n,{type:m})};
async function shareOrders(list,withPhotos){
 const text=list.map(orderText).join('\n\n');
 try{
  if(navigator.share){
   let data={title:'Sipariş',text};
   if(withPhotos&&navigator.canShare){const files=[];let n=0;for(const o of list)for(const i of o.items||[])for(const p of itemPhotos(i))files.push(toFile(p,`foto-${++n}.jpg`));
    if(files.length&&navigator.canShare({files}))data={...data,files}}
   await navigator.share(data);return;
  }
 }catch(e){if(e&&e.name==='AbortError')return}
 try{await navigator.clipboard.writeText(text);toast('Metin kopyalandı, istediğin yere yapıştır');return}catch{}
 await say(text);
}
async function openDetail(id){
 const o=await get(id);if(!o)return goList();
 $('vDetail').innerHTML=`<button class="secondary" id="back" type="button">← Listeye dön</button><section class="panel"><div class="orderhead"><div><h2 style="margin-bottom:4px">${esc(o.customer||'İsimsiz müşteri')}</h2>${vehicleText(o)?`<div class="muted">${esc(vehicleText(o))}</div>`:''}<div class="muted">${esc(formatDate(o.date))}</div></div><span class="status ${o.status==='Teslim edildi'?'done':o.status==='İade'?'ret':''}">${esc(o.status)}</span></div><div style="margin-top:10px">${(o.items||[]).map(i=>`<div class="itemline" style="--c:${CCOL[i.category]||'#64748b'}"><div><b class="catname">${esc(i.category)}</b>${i.name?`<br>${esc(i.name)}`:''}<br><span class="muted">${i.qty} adet</span></div>${itemPhotos(i).length?`<div class="dphotos">${itemPhotos(i).map(p=>`<img class="dphoto" src="${p}" alt="">`).join('')}</div>`:'<span class="muted">Fotoğraf yok</span>'}</div>`).join('')||'<p class="muted">Ürün eklenmemiş.</p>'}</div>${o.notes?`<p class="muted" style="margin-top:10px">Not: ${esc(o.notes)}</p>`:''}<div class="actions"><button class="primary" id="sh" type="button">Paylaş</button><button class="secondary" id="ed" type="button">Düzenle</button><button class="danger" id="dl" type="button">Sil</button></div></section>`;
 $('back').onclick=goList;$('ed').onclick=()=>openForm(o);$('sh').onclick=()=>shareOrders([o],true);
 $('dl').onclick=async()=>{if(await ask('Bu sipariş kaydı silinsin mi? Bu işlem geri alınamaz.','Sil')){await del(id);toast('Kayıt silindi');goList()}};
 show('vDetail');
}

/* ---- Form ---- */
const newItem=()=>({uid:uid(),category:CATS[0],name:'',qty:1,photos:[]});
function updateWeekday(){const v=$('date').value;$('weekday').textContent=v?'Gün: '+formatDate(v).split(' · ')[1]:''}
function renderItems(){
 $('items').innerHTML=items.map((it,i)=>`<div class="item" data-u="${it.uid}" style="--c:${CCOL[it.category]||'#64748b'}"><div class="ihead"><b>Ürün ${i+1}</b><button type="button" class="danger sm" data-a="rm">Ürünü sil</button></div><select data-a="cat">${CATS.map(c=>`<option${c===it.category?' selected':''}>${c}</option>`).join('')}</select><input type="text" data-a="name" class="iname" value="${esc(it.name||'')}" placeholder="Hangi ürün? Örn. Megane 4 sol far"><div class="qty"><button type="button" data-a="dec" aria-label="Azalt">−</button><span>${it.qty}</span><button type="button" data-a="inc" aria-label="Artır">+</button><small>adet</small></div>${(it.photos||[]).length?`<div class="photos">${it.photos.map((p,k)=>`<div class="ph"><img src="${p}" alt=""><button type="button" data-a="rmph" data-k="${k}" aria-label="Fotoğrafı sil">✕</button></div>`).join('')}</div>`:''}<div class="photobtns"><label class="photo">📷 Fotoğraf çek<input type="file" accept="image/*" capture="environment" hidden data-a="ph"></label><label class="photo">🖼️ Galeriden ekle<input type="file" accept="image/*" multiple hidden data-a="ph"></label></div><div class="muted">${(it.photos||[]).length} fotoğraf</div></div>`).join('');
}
function openForm(o){
 editingId=o?o.id:null;
 $('formTitle').textContent=o?'Kaydı düzenle':'Yeni müşteri kaydı';$('saveBtn').textContent=o?'Değişiklikleri kaydet':'Kaydı kaydet';
 $('customer').value=o?.customer||'';
 $('date').value=o?.date||today();$('status').value=o?.status||'Hazırlandı';updateWeekday();
 items=o?(o.items||[]).map(i=>({...i,uid:i.uid||uid(),photos:[...itemPhotos(i)]})):[newItem()];
 renderItems();renderChips();show('vForm');
}
$('newBtn').onclick=()=>openForm(null);
$('formBack').onclick=()=>{if(editingId)openDetail(editingId);else goList()};
$('date').onchange=updateWeekday;
$('addItem').onclick=()=>{items.push(newItem());renderItems();$('items').lastElementChild.scrollIntoView({behavior:'smooth',block:'center'})};
function resizeImage(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,1000/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.78))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
const rowOf=e=>{const el=e.target.closest('.item');return el&&items.find(x=>x.uid===el.dataset.u)};
$('items').onclick=e=>{
 const b=e.target.closest('button');if(!b)return;const it=rowOf(e);if(!it)return;const a=b.dataset.a;
 if(a==='inc'||a==='dec'){it.qty=Math.max(0,it.qty+(a==='inc'?1:-1));b.closest('.qty').querySelector('span').textContent=it.qty}
 else if(a==='rm'){items=items.filter(x=>x!==it);renderItems()}
 else if(a==='rmph'){it.photos.splice(+b.dataset.k,1);renderItems()}
};
$('items').oninput=e=>{if(e.target.dataset.a==='name'){const it=rowOf(e);if(it)it.name=e.target.value}};
$('items').onchange=async e=>{
 const it=rowOf(e);if(!it)return;const a=e.target.dataset.a;
 if(a==='cat'){it.category=e.target.value;e.target.closest('.item').style.setProperty('--c',CCOL[it.category]||'#64748b')}
 else if(a==='ph'&&e.target.files.length){const fs=[...e.target.files];try{for(const f of fs)it.photos.push(await resizeImage(f));renderItems()}catch{toast('Fotoğraf okunamadı')}}
};
$('vDetail').onclick=e=>{if(e.target.classList.contains('dphoto')){$('lbImg').src=e.target.src;$('lb').hidden=false}};
$('lb').onclick=()=>{$('lb').hidden=true};
/* ---- Yüklenebilirlik durumu ---- */
let dip=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;$('installBtn').hidden=false;pwaInfo()});
addEventListener('appinstalled',()=>{$('installBtn').hidden=true;toast('Uygulama yüklendi')});
$('installBtn').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch{}dip=null;$('installBtn').hidden=true};
async function pwaInfo(){
 const l=['Adres: '+(location.protocol==='https:'?'https ✓':'https değil ✗')];
 try{const r=await navigator.serviceWorker.getRegistration();l.push('Servis çalışanı: '+(r&&r.active?'çalışıyor ✓':r?'kuruluyor…':'yok ✗'))}catch{l.push('Servis çalışanı: yok ✗')}
 try{const k=document.querySelector('link[rel=manifest]');l.push('Manifest: '+(k&&(await fetch(k.href)).ok?'yüklendi ✓':'bulunamadı ✗'))}catch{l.push('Manifest: bulunamadı ✗')}
 l.push('Chrome yükleme izni: '+(dip?'verdi ✓':'henüz vermedi'));
 l.push('Açık mod: '+(matchMedia('(display-mode: standalone)').matches?'uygulama':'tarayıcı'));
 $('pwaInfo').innerHTML=l.map(esc).join('<br>');
}
document.querySelector('details.bk').addEventListener('toggle',pwaInfo);
$('f').onsubmit=async e=>{
 e.preventDefault();
 const old=editingId?await get(editingId):null;
 const o={...(old||{}),id:editingId||uid(),created:old?.created||Date.now(),schema:2,customer:$('customer').value.trim(),date:$('date').value,status:$('status').value,items:items.map(({uid,category,name,qty,photos})=>({uid,category,name:name||'',qty,photos:photos||[]}))};
 try{await put(o);if(!old||key(old.customer)!==key(o.customer))await ensureCustomer(o.customer).catch(()=>{});toast('Kayıt kaydedildi');openDetail(o.id)}catch{await say('Kayıt kaydedilemedi. Depolama dolu olabilir; önce yedek al.')}
};

/* ---- Yedekleme ---- */
function download(data,name){const u=URL.createObjectURL(new Blob([JSON.stringify(data)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}
$('exportBtn').onclick=async()=>{const d=await all();download({app:'siparis-takip',version:2,exported:new Date().toISOString(),orders:d,customers:custs},'siparis-yedegi-'+today()+'.json');toast(d.length+' kayıt yedeklendi')};
$('preBtn').onclick=async()=>download({app:'siparis-takip',version:1,note:'Güncelleme öncesi eski kayıtlar',orders:await all(BK)},'siparis-eski-yedek-'+today()+'.json');
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{
  const d=JSON.parse(await f.text()),arr=Array.isArray(d)?d:d.orders;
  if(!Array.isArray(arr))throw Error();
  const valid=arr.filter(o=>o&&o.id&&(Array.isArray(o.items)||Array.isArray(o.parts)));
  if(!valid.length)throw Error();
  const have=new Set((await all()).map(o=>o.id)),fresh=valid.filter(o=>!have.has(o.id)),dup=valid.filter(o=>have.has(o.id));
  if(!await ask(`${fresh.length} yeni kayıt eklenecek, ${dup.length} kayıt zaten mevcut. Devam edilsin mi?`,'Devam'))return;
  for(const o of fresh)await put(norm(o));
  let over=0;
  if(dup.length&&await ask(`Zaten mevcut olan ${dup.length} kaydın üzerine yedektekiler yazılsın mı?`,'Üzerine yaz','Mevcutları koru')){for(const o of dup)await put(norm(o));over=dup.length}
  for(const o of valid)await ensureCustomer(o.customer);for(const c of (d.customers||[]))await ensureCustomer(c&&c.name);
  await render();await say(`Yedek yüklendi.\nEklenen: ${fresh.length}\nÜzerine yazılan: ${over}\nKorunan mevcut kayıt: ${dup.length-over}`);
 }catch{await say('Yedek dosyası okunamadı veya geçerli kayıt içermiyor. Mevcut kayıtlara dokunulmadı.')}
};

/* ---- Başlangıç ---- */
(async()=>{
 try{
  if(!('indexedDB' in window))throw Error();
  await openDB();await migrate();await loadCusts();await seedCusts();
  if((await all(BK)).length)$('preBtn').hidden=false;
  navigator.storage?.persist?.();
  await render();
 }catch(e){document.body.insertAdjacentHTML('beforeend','<p class="note">Bu tarayıcı yerel kayıtları açamadı. Chrome gibi güncel bir tarayıcıda dene.</p>')}
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
